name: Release to Play (internal)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run on manual dispatch or v* tags only when signing + Play secrets are configured
    if: |
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) &&
      secrets.KEYSTORE_BASE64 != '' &&
      secrets.KEYSTORE_PASSWORD != '' &&
      secrets.KEY_ALIAS != '' &&
      secrets.KEY_PASSWORD != '' &&
      secrets.PLAY_SERVICE_ACCOUNT_JSON != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > focusflow-release.jks
          test -s focusflow-release.jks

      - name: Build signed release bundle
        env:
          KEYSTORE_FILE: focusflow-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseG1GC"
        timeout-minutes: 35

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kodierer.focusflow
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Cleanup keystore
        if: always()
        run: rm -f focusflow-release.jks